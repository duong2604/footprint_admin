services:
  mysql:
    image: mysql:8.0
    container_name: footprint
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: footprint
      MYSQL_DATABASE: footprint
      MYSQL_USER: footprint
      MYSQL_PASSWORD: footprint
    ports:
      - "3307:3306"
    volumes:
      - footprint_data:/var/lib/mysql

volumes:
  footprint_data:
